[project]
name = "feigenbaum-lenia"
version = "0.1.0"
description = "Feigenbaum-Lenia: Evolving cellular automata with conditional Lyapunov exponents"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "jax>=0.4.25",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
modal = ["modal"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
