[project]
name = "hyperlife"
version = "0.1.0"
description = "Hyperlife: evolving artificial life in 4D/5D Flow-Lenia"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "jax>=0.4.25",
    "matplotlib",
    "scipy",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.5"]
modal = ["modal"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "alife_jax",
    "analyze_eco",
    "feigenbaum_lenia",
    "fl_brain",
    "fl_eco",
    "fl_eco2",
    "fl_eco3",
    "fl_glider",
    "fl_jax",
    "fl_poison",
    "fl_pred",
    "fl_season",
    "lineage_tracking",
    "glider_coll",
    "helpers",
    "modal_app",
    "price_equation",
    "render",
]

[tool.ruff]
line-length = 100
force-exclude = true
# The legacy list: files that predate docs/style-profile.md and do not meet it. It mirrors
# exceptions E1-E5 of the profile (scope, reason, owner). This is the only copy:
# tests/test_style_limits.py reads it, applies the line and function limits to every other
# Python file, and fails when an entry is missing or no longer exceeds a limit. The list
# can only shrink. Do not add a file to it.
extend-exclude = [
    # E1, engines behind the published numbers of Parts 5-19: 8 files.
    "src/fl_brain.py",
    "src/fl_eco.py",
    "src/fl_eco2.py",
    "src/fl_eco3.py",
    "src/fl_glider.py",
    "src/fl_poison.py",
