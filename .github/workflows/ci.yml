name: CI

on:
  push:
  pull_request:

# The workflow reads the repository and uses no secret, so a pull request from a fork
# can run it without risk.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
    steps:
      # Actions are pinned by commit hash; the comment names the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Install from the lockfile
        run: uv sync --locked --extra dev
      - name: Check the format
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Run the tests
        run: uv run --no-sync python -m pytest -q
